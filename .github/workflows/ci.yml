name: ci

on:
  push:
  pull_request:

# The job only reads the repository; GITHUB_TOKEN gets no write scope.
permissions:
  contents: read

env:
  CI: true
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24
            experimental: false
          - node: 25
            experimental: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generated binding types are current
        run: npm run typegen:check

      - name: Seed is byte-identical to the generator
        run: npm run seed:check

      - name: Typecheck (worker, web, node projects)
        run: npm run typecheck

      - name: Tests (worker in workerd, node, web)
        run: npm test

      - name: Build (and check class names survive bundling)
        run: npm run build

      - name: Standard eval, 60 scenarios, CI gate
        run: npm run eval:ci

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results-node-${{ matrix.node }}
          path: eval/results/*.json
          if-no-files-found: warn

      # Last: it leaves a production-flattened dist/ (with the AI binding),
      # which a later `wrangler dev` would try to log in for.
      - name: Production deploy dry run (no credentials)
        run: npm run deploy:dry-run
